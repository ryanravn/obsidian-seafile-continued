name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          test "$(node -p "require('./manifest.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          node -e "const versions = require('./versions.json'); if (!versions[process.env.RELEASE_VERSION]) process.exit(1)"

      - name: Run tests
        run: npm test -- --runInBand

      - name: Lint source
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/styles.css
            dist/manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/main.js \
            dist/styles.css \
            dist/manifest.json \
            --verify-tag \
            --generate-notes \
            --latest
